paths:

  /apartment-images:

    get:
      tags:
        - apartment-images

      summary: Get all apartment images

      responses:

        200:
          description: List of apartment images

          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: "#/components/schemas/ApartmentImage"

        404:
          description: Images not found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageNotFound"

        500:
          description: Internal server error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

    post:
      tags:
        - apartment-images

      summary: Create apartment image
      description: Admin only (requires JWT + role check in backend)

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApartmentImage"

      responses:

        201:
          description: Apartment image created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentImage"

        400:
          description: Validation error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        401:
          description: Unauthorized

        403:
          description: Forbidden (admin only)

        500:
          description: Internal server error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

  /apartment-images/upload:

    post:
      tags:
        - apartment-images

      summary: Upload apartment image
      description: Upload image using multipart/form-data (Multer). Admin only.

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          multipart/form-data:
            schema:
              type: object

              required:
                - apartmentId
                - image

              properties:

                apartmentId:
                  type: string
                  format: uuid
                  example: 194d18a1-2109-4fa2-9c37-939d85ea8b1e

                image:
                  type: string
                  format: binary
                  description: Multer field name = image

      responses:

        201:
          description: Image uploaded successfully

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentImage"

        400:
          description: Validation error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        401:
          description: Unauthorized

        403:
          description: Forbidden (admin only)

        500:
          description: Internal server error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

  /apartment-images/{id}:

    patch:
      tags:
        - apartment-images

      summary: Update apartment image
      description: Admin only (requires JWT + role check in backend)

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: string
            format: uuid

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApartmentImage"

      responses:

        200:
          description: Apartment image updated

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentImage"

        400:
          description: Validation error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        401:
          description: Unauthorized

        403:
          description: Forbidden (admin only)

        404:
          description: Image not found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageNotFound"

        500:
          description: Internal server error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

    delete:
      tags:
        - apartment-images

      summary: Delete image by id
      description: Deletes database record and physical file from Supabase Storage. Admin only.

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          description: Image ID

          schema:
            type: string
            format: uuid

      responses:

        200:
          description: Image deleted successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Image deleted successfully

        401:
          description: Unauthorized

        403:
          description: Forbidden (admin only)

        404:
          description: Image not found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageNotFound"

        500:
          description: Internal server error

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

components:

  schemas:

    ApartmentImage:
      type: object

      properties:

        id:
          type: string
          format: uuid
          example: 56bf1941-8cd0-48fc-be71-4d0af86b469a

        apartment_id:
          type: string
          format: uuid
          example: 194d18a1-2109-4fa2-9c37-939d85ea8b1e

        image_url:
          type: string
          format: uri
          example: https://example.com/image.jpg

        created_at:
          type: string
          format: date-time
          example: 2026-05-14T05:25:31.341061

        position:
          type: integer
          example: 0

        is_cover:
          type: boolean
          example: false

    CreateApartmentImage:
      type: object

      required:
        - apartment_id
        - image_url

      properties:

        apartment_id:
          type: string
          format: uuid

        image_url:
          type: string
          format: uri

        position:
          type: integer
          minimum: 0
          default: 0

        is_cover:
          type: boolean
          default: false

    UpdateApartmentImage:
      type: object

      properties:

        image_url:
          type: string
          format: uri

        position:
          type: integer
          minimum: 0

        is_cover:
          type: boolean

    ImageNotFound:
      type: object

      properties:

        message:
          type: string
          example: Image not found

    ValidationError:
      type: object

      properties:

        message:
          type: string
          example: Validation error

        errors:
          type: array

          items:
            type: object

            properties:

              field:
                type: string
                example: apartment_id

              message:
                type: string
                example: Invalid apartment id

    InternalServerError:
      type: object

      properties:

        message:
          type: string
          example: Internal server error