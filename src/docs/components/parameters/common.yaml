id:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
    
from:
  name: from
  in: query
  required: false
  schema:
    type: string
    format: date
    example: 2026-07-01
  description: Check-in date (YYYY-MM-DD)

to:
  name: to
  in: query
  required: false
  schema:
    type: string
    format: date
    example: 2026-07-05
  description: Check-out date (YYYY-MM-DD)

guests:
  name: guests
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    example: 2
  description: Number of guests

city:
  name: city
  in: query
  required: false
  schema:
    type: string
    example: Warsaw
  description: City name

status:    
    name: status
    in: query
    schema:
      type: string
      enum: [pending, confirmed, cancelled, completed]

apartment_id:
    name: apartment_id
    in: query
    schema:
      type: string
      format: uuid
email:
    name: email
    in: query
    schema:
      type: string
      format: email

fromDate:
    name: fromDate
    in: query
    schema:
      type: string
      format: date

toDate:
    name: toDate
    in: query
    schema:
      type: string
      format: date