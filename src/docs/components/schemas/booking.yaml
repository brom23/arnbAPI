CreateBooking:
  type: object
  required:
    - apartment_id
    - check_in
    - check_out
    - guests
    - email
    - total_price
    - first_name
    - last_name
    - phone
    - city
    - zip
    - street
    - country
  properties:
    apartment_id:
      type: string
      format: uuid

    check_in:
      type: string
      format: date

    check_out:
      type: string
      format: date

    guests:
      type: integer

    email:
      type: string
      format: email

    total_price:
      type: number

    first_name:
      type: string

    last_name:
      type: string

    phone:
      type: string

    city:
      type: string

    zip:
      type: string

    street:
      type: string

    country:
      type: string

    notes:
      type: string
      nullable: true

Booking:
  type: object
  properties:
    id:
      type: string
      format: uuid

    apartment_id:
      type: string
      format: uuid

    check_in:
      type: string
      format: date

    check_out:
      type: string
      format: date

    guests:
      type: integer

    email:
      type: string
      format: email

    status:
      type: string
      enum: [pending, confirmed, cancelled, completed]

    total_price:
      type: number

    first_name:
      type: string

    last_name:
      type: string

    phone:
      type: string

    city:
      type: string

    zip:
      type: string

    street:
      type: string

    country:
      type: string

    notes:
      type: string
      nullable: true

    hold_expires_at:
      type: string
      format: date-time
      nullable: true

    created_at:
      type: string
      format: date-time

UpdateBooking:
  type: object
  description: Partial update of booking (admin only)
  properties:
    apartment_id:
      type: string
      format: uuid

    check_in:
      type: string
      format: date

    check_out:
      type: string
      format: date

    guests:
      type: integer

    email:
      type: string
      format: email

    total_price:
      type: number

    first_name:
      type: string

    last_name:
      type: string

    phone:
      type: string

    city:
      type: string

    zip:
      type: string

    street:
      type: string

    country:
      type: string

    notes:
      type: string
      nullable: true

CalendarBooking:
  type: object
  properties:
    id:
      type: string
      format: uuid

    apartment_id:
      type: string
      format: uuid

    check_in:
      type: string
      format: date

    check_out:
      type: string
      format: date

    email:
      type: string
      example: john@example.com

    status:
      type: string
      example: confirmed

    guests:
      type: integer
      example: 2

    total_price:
      type: number
      example: 1200

    first_name:
      type: string
      example: John

    last_name:
      type: string
      example: Smith

    apartments:
      type: object
      properties:
        title:
          type: string
          example: Apartament Nad Morzem
