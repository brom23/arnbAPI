paths:

  /apartments:
    get:
      tags:
        - apartments
      summary: Get all apartments
      responses:
        200:
          description: List of all apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Apartment"

    post:
      tags:
        - apartments
      summary: Create apartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApartment"
      responses:
        201:
          description: Apartment created


  /apartments/search:
    get:
      tags:
        - apartments
      summary: Search apartments
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Apartment"


  /apartments/available:
    post:
      tags:
        - apartments
      summary: Get available apartments
      description: Airbnb-like overlap logic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from
                - to
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                guests:
                  type: integer
                  nullable: true
                city:
                  type: string
                  nullable: true

      responses:
        200:
          description: Available apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableApartment"

        400:
          description: Validation error

        500:
          description: Internal server error


  /apartments/{id}:
    get:
      tags:
        - apartments
      summary: Get apartment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Apartment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"

        404:
          description: Not found

    patch:
      tags:
        - apartments
      summary: Update apartment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApartment"
      responses:
        200:
          description: Updated

    delete:
      tags:
        - apartments
      summary: Delete apartment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Deleted


  /apartments/{id}/cover:
    patch:
      tags:
        - apartments
      summary: Update cover image
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageId
              properties:
                imageId:
                  type: string
                  format: uuid
      responses:
        200:
          description: Updated


  /apartments/{id}/images:
    get:
      tags:
        - apartments
      summary: Get apartment images
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: OK

  /apartments/{id}/pricing:
    get:
      tags:
        - apartments
      summary: Get apartment pricing by date range
      description: |
        Returns pricing calendar for an apartment.

        - If no query params are provided → returns full pricing map
        - If `from` and `to` are provided → returns filtered date range
        - Both `from` and `to` must be provided together

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            example: "2026-06-25"
          description: Start date (YYYY-MM-DD)

        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            example: "2026-06-30"
          description: End date (YYYY-MM-DD)

      responses:
        200:
          description: Pricing map
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: object
                    additionalProperties:
                      type: number
                    example:
                      "2026-05-28": 101
                      "2026-05-29": 101
                      "2026-05-30": 101

        400:
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      missingFrom:
                        value: "Query parameter 'from' is missing. Both 'from' and 'to' must be provided together."
                      missingTo:
                        value: "Query parameter 'to' is missing. Both 'from' and 'to' must be provided together."
                      invalidFormat:
                        value: "Invalid date format. Use YYYY-MM-DD"

        404:
          description: No pricing found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No pricing found for this apartment"

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"

  /apartments/{id}/bookings/unavailable-dates:
    get:
      tags:
        - apartments
      summary: Get unavailable dates
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: OK


  /apartment-images:
    get:
      tags:
        - apartment-images
      summary: Get images
      responses:
        200:
          description: OK

    post:
      tags:
        - apartment-images
      summary: Create image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApartmentImage"
      responses:
        201:
          description: Created


  /apartment-images/upload:
    post:
      tags:
        - apartment-images
      summary: Upload image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - apartmentId
                - image
              properties:
                apartmentId:
                  type: string
                  format: uuid
                image:
                  type: string
                  format: binary
      responses:
        201:
          description: Uploaded


  /apartment-images/{id}:
    delete:
      tags:
        - apartment-images
      summary: Delete image
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: Deleted


components:

  schemas:

    Apartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
          nullable: true
        description:
          type: string
        price_per_night:
          type: number
        guests:
          type: integer
        city:
          type: string
        image:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        base_price:
          type: number
        max_rooms:
          type: integer
        cancellation_type:
          type: string
        apartment_number:
          type: string
        floor:
          type: string
        staircase:
          type: string
        has_balcony:
          type: boolean
        amenities:
          type: string
        beds:
          type: integer
        min_guests:
          type: integer
        title_en:
          type: string
        description_en:
          type: string
        amenities_en:
          type: string
        apartment_images:
          type: array
          items:
            $ref: "#/components/schemas/ApartmentImage"


    ApartmentImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        apartment_id:
          type: string
          format: uuid
        image_url:
          type: string
        created_at:
          type: string
          format: date-time
        position:
          type: integer
        is_cover:
          type: boolean


    ApartmentBooking:
      type: object
      properties:
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date


    AvailableApartment:
      allOf:
        - $ref: "#/components/schemas/Apartment"
        - type: object
          properties:
            bookings:
              type: array
              items:
                $ref: "#/components/schemas/ApartmentBooking"


    CreateApartment:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price_per_night:
          type: number
        guests:
          type: integer
        city:
          type: string


    UpdateApartment:
      type: object
      properties:
        title:
          type: string
        description:
          type: string


    CreateApartmentImage:
      type: object
      properties:
        apartment_id:
          type: string
          format: uuid
        image_url:
          type: string


    ApartmentNotFound:
      type: object
      properties:
        message:
          type: string


    InternalServerError:
      type: object
      properties:
        message:
          type: string