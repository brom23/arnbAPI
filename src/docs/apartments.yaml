paths:

  /apartments:
    get:
      tags:
        - apartments
      summary: Get apartments (paginated)
      description: |
        Returns paginated apartments list.

        Supports:
        - pagination
        - city filtering
        - guests filtering
        - availability filtering (from/to)

        Example:
        /apartments?from=2026-06-01&to=2026-06-07
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 10

        - name: city
          in: query
          required: false
          schema:
            type: string
            example: Kraków

        - name: guests
          in: query
          required: false
          schema:
            type: integer
            example: 2

        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date

      responses:
        200:
          description: Paginated apartments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Apartment"

                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

    post:
      tags:
        - apartments
      summary: Create apartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApartment"
      responses:
        201:
          description: Apartment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden
        500:
          description: Internal server error

  /apartments/search:
    get:
      tags:
        - apartments
      summary: Search apartments
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: guests
          in: query
          schema:
            type: integer
      responses:
        200:
          description: Filtered apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Apartment"

  /apartments/{id}:
    get:
      tags:
        - apartments
      summary: Get apartment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Apartment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"

    patch:
      tags:
        - apartments
      summary: Update apartment
      security:
        - bearerAuth: []
      responses:
        200:
          description: Updated apartment

  /apartments/{id}/cover:
    patch:
      tags:
        - apartments
      summary: Update cover image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageId
              properties:
                imageId:
                  type: string
                  format: uuid
      responses:
        200:
          description: Cover updated

  /apartments/{id}/images:
    get:
      tags:
        - apartments
      summary: Get apartment images
      responses:
        200:
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApartmentImage"

  /apartments/available:
    post:
      tags:
        - apartments

      summary: Get available apartments (no pagination)

      description: |
        Returns list of apartments available in given date range.
        Applies Airbnb-style overlap detection and guest filtering.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from
                - to
              properties:
                from:
                  type: string
                  format: date
                  example: 2026-06-01

                to:
                  type: string
                  format: date
                  example: 2026-06-07

                guests:
                  type: integer
                  example: 2
                  nullable: true

        responses:
          200:
            description: List of available apartments
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: "#/components/schemas/Apartment"

          400:
            description: Validation error

          500:
            description: Internal server error
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/InternalServerError"
    delete:
      tags:
        - apartment-images
      summary: Delete all apartment images
      security:
        - bearerAuth: []
      responses:
        200:
          description: Images deleted

  /apartments/{id}/bookings/unavailable-dates:
    get:
      tags:
        - apartments
      summary: Get unavailable dates
      responses:
        200:
          description: Dates

  /apartment-images:
    get:
      tags:
        - apartment-images
      summary: Get all images
      responses:
        200:
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApartmentImage"

    post:
      tags:
        - apartment-images
      summary: Create image record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApartmentImage"
      responses:
        201:
          description: Created

  /apartment-images/upload:
    post:
      tags:
        - apartment-images
      summary: Upload image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - apartmentId
                - image
              properties:
                apartmentId:
                  type: string
                  format: uuid
                image:
                  type: string
                  format: binary
      responses:
        201:
          description: Uploaded

  /apartment-images/{id}:
    delete:
      tags:
        - apartment-images
      summary: Delete image
      security:
        - bearerAuth: []
      responses:
        200:
          description: Deleted

components:
  schemas:

    Apartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price_per_night:
          type: number
        guests:
          type: integer
        city:
          type: string

    CreateApartment:
      type: object
      required:
        - title
        - description
        - price_per_night
        - guests
        - city
      properties:
        title:
          type: string
        description:
          type: string
        price_per_night:
          type: number
        guests:
          type: integer
        city:
          type: string

    ApartmentImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        apartment_id:
          type: string
          format: uuid
        image_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        position:
          type: integer
        is_cover:
          type: boolean

    CreateApartmentImage:
      type: object
      required:
        - apartment_id
        - image_url
      properties:
        apartment_id:
          type: string
          format: uuid
        image_url:
          type: string
          format: uri

    InternalServerError:
      type: object
      properties:
        message:
          type: string
          example: Internal server error