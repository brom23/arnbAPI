paths:

  /apartments:
    get:
      tags:
        - apartments
      summary: Get all apartments
      responses:
        200:
          description: List of apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Apartment"

        404:
          description: No apartments found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundResponse"

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

    post:
      tags:
        - apartments
      summary: Create apartment
      description: Admin only (requires JWT + role check in backend)

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApartment"

      responses:
        201:
          description: Apartment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"

        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        401:
          description: Unauthorized (no token)

        403:
          description: Forbidden (admin only)

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

  /apartments/search:
    get:
      tags:
        - apartments
      summary: Search apartments
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string

        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: guests
          in: query
          required: false
          schema:
            type: integer

      responses:
        200:
          description: Filtered apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Apartment"

        400:
          description: Invalid search parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchError"

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

  /apartments/{id}:
    get:
      tags:
        - apartments
      summary: Get apartment by ID

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        200:
          description: Apartment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"

        404:
          description: Apartment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentNotFound"

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

    patch:
      tags:
        - apartments
      summary: Update apartment
      description: Admin only (requires JWT + role check in backend)

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApartment"

      responses:
        200:
          description: Apartment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"

        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        401:
          description: Unauthorized

        403:
          description: Forbidden (admin only)

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
 
    delete:
      tags:
        - apartments
      summary: Delete apartment
      description: Admin only (requires JWT + role check in backend)

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Apartment ID
          schema:
            type: string
            format: uuid

      responses:
        200:
          description: Apartment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Apartment deleted successfully

        401:
          description: Unauthorized

        403:
          description: Forbidden (admin only)

        404:
          description: Apartment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentNotFound"

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

  /apartments/{id}/bookings/unavailable-dates:
    get:
      tags:
        - apartments
      summary: Get unavailable booking dates

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        200:
          description: Unavailable dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  apartmentId:
                    type: string
                    format: uuid

                  unavailableDates:
                    type: array
                    items:
                      type: string
                      format: date

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

components:

  schemas:

    Apartment:
      type: object
      properties:
        id:
          type: string
          format: uuid

        title:
          type: string
          example: Loft Premium

        slug:
          type: string
          nullable: true

        description:
          type: string
          example: Luxury apartment in city center

        price_per_night:
          type: number
          example: 420

        guests:
          type: integer
          example: 2

        city:
          type: string
          example: Kraków

        image:
          type: string
          format: uri

        created_at:
          type: string
          format: date-time

        base_price:
          type: number
          example: 100

        max_rooms:
          type: integer
          example: 1

        cancellation_type:
          type: string
          example: flexible

        apartment_number:
          type: string
          example: "1"

        floor:
          type: string
          example: parter

        staircase:
          type: string
          example: "1"

        has_balcony:
          type: boolean
          example: false

        amenities:
          type: string
          example: aneks kuchenny, mikrofalówka, tv

        beds:
          type: integer
          example: 2

        min_guests:
          type: integer
          example: 1

    CreateApartment:
      type: object

      required:
        - title
        - description
        - price_per_night
        - guests
        - city

      properties:
        title:
          type: string

        description:
          type: string

        price_per_night:
          type: number

        guests:
          type: integer

        city:
          type: string

        image:
          type: string
          format: uri

        base_price:
          type: number

        max_rooms:
          type: integer

        cancellation_type:
          type: string

        apartment_number:
          type: string

        floor:
          type: string

        staircase:
          type: string

        has_balcony:
          type: boolean

        amenities:
          type: string

        beds:
          type: integer

        min_guests:
          type: integer

    UpdateApartment:
      type: object

      properties:
        title:
          type: string

        description:
          type: string

        price_per_night:
          type: number

        guests:
          type: integer

        city:
          type: string

        image:
          type: string
          format: uri

        base_price:
          type: number

        max_rooms:
          type: integer

        cancellation_type:
          type: string

        apartment_number:
          type: string

        floor:
          type: string

        staircase:
          type: string

        has_balcony:
          type: boolean

        amenities:
          type: string

        beds:
          type: integer

        min_guests:
          type: integer

    ApartmentNotFound:
      type: object
      properties:
        message:
          type: string
          example: Apartment not found

    NotFoundResponse:
      type: object
      properties:
        message:
          type: string
          example: No apartments found

    SearchError:
      type: object
      properties:
        message:
          type: string
          example: At least one search parameter is required

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Validation error

        errors:
          type: object

    InternalServerError:
      type: object
      properties:
        message:
          type: string
          example: Internal server error