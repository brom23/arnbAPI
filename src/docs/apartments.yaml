paths:

  /apartments:
    get:
      tags:
        - apartments
      summary: Get all apartments
      description: Returns list of all apartments with basic pricing and metadata
      responses:
        200:
          description: List of all apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Apartment"
              example:
                - id: "194d18a1-2109-4fa2-9c37-939d85ea8b1e"
                  title: "Loft Premium"
                  slug: null
                  description: "uzy"
                  price_per_night: 420
                  guests: 2
                  city: "Kraków"
                  image: "https://example.com/image.jpg"
                  created_at: "2026-05-12T12:28:54.721482"
                  base_price: 100
                  max_rooms: 1
                  cancellation_type: "flexible"
                  apartment_number: "1"
                  floor: "parter"
                  staircase: "1"
                  has_balcony: false
                  amenities: "wifi, kitchen"
                  beds: 2
                  min_guests: 1
                  title_en: "Premium Loft"
                  description_en: "Big"
                  amenities_en: "kitchen, wifi"

    post:
      tags:
        - apartments
      summary: Create apartment
      description: |
        Creates a new apartment.
        Validated with Zod schema (createApartmentSchema).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApartment"
            example:
              title: "Loft Premium"
              description: "Nowoczesny apartament w centrum miasta"
              price_per_night: 420
              guests: 2
              city: "Kraków"
              base_price: 100
              max_rooms: 1
              cancellation_type: "flexible"
              apartment_number: "1A"
              floor: "2"
              staircase: "A"
              has_balcony: false
              amenities: "wifi, kitchen, tv"
              beds: 2
              min_guests: 1
      responses:
        201:
          description: Apartment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"

        400:
          description: Validation error (Zod)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Validation error"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
              example:
                message: "Validation error"
                errors:
                  - field: "title"
                    message: "Title is required"

        500:
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"


  /apartments/search:
    get:
      tags:
        - apartments
      summary: Search apartments
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Apartment"


  /apartments/available:
    post:
      tags:
        - apartments
      summary: Get available apartments
      description: Airbnb-like overlap logic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from
                - to
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                guests:
                  type: integer
                  nullable: true
                city:
                  type: string
                  nullable: true

      responses:
        200:
          description: Available apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableApartment"

        400:
          description: Validation error

        500:
          description: Internal server error


  /apartments/{id}:
    get:
      tags:
        - apartments
      summary: Get apartment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Apartment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"

        404:
          description: Not found

    patch:
      tags:
        - apartments
      summary: Update apartment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApartment"
      responses:
        200:
          description: Updated

    delete:
      tags:
        - apartments
      summary: Delete apartment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Deleted


  /apartments/{id}/cover:
    patch:
      tags:
        - apartments
      summary: Update cover image
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageId
              properties:
                imageId:
                  type: string
                  format: uuid
      responses:
        200:
          description: Updated


  /apartments/{id}/images:
    get:
      tags:
        - apartments
      summary: Get apartment images
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: OK

  /apartments/{id}/pricing:
    get:
      tags:
        - apartments
      summary: Get apartment pricing calendar
      description: |
        Returns pricing map for apartment.

        Rules:
        - No query params → returns full pricing
        - from + to required together
        - invalid range → 400 error
        - no data → 404 error

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            example: "2026-05-01"

        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            example: "2026-05-10"

      responses:
        200:
          description: Pricing map
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: object
                    additionalProperties:
                      type: number
              example:
                prices:
                  "2026-05-28": 101
                  "2026-05-29": 101

        400:
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                missingTo:
                  value:
                    message: "Query parameter 'to' is required when 'from' is provided"
                missingFrom:
                  value:
                    message: "Query parameter 'from' is required when 'to' is provided"

        404:
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

        500:
          description: Internal server error

  /apartments/{id}/bookings/unavailable-dates:
    get:
      tags:
        - apartments
      summary: Get unavailable dates
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: OK


  /apartment-images:
    get:
      tags:
        - apartment-images
      summary: Get images
      responses:
        200:
          description: OK

    post:
      tags:
        - apartment-images
      summary: Create image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApartmentImage"
      responses:
        201:
          description: Created


  /apartment-images/upload:
    post:
      tags:
        - apartment-images
      summary: Upload image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - apartmentId
                - image
              properties:
                apartmentId:
                  type: string
                  format: uuid
                image:
                  type: string
                  format: binary
      responses:
        201:
          description: Uploaded


  /apartment-images/{id}:
    delete:
      tags:
        - apartment-images
      summary: Delete image
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: Deleted


components:

  schemas:

    Apartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
          nullable: true
        description:
          type: string
        price_per_night:
          type: number
        guests:
          type: integer
        city:
          type: string
        image:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        base_price:
          type: number
        max_rooms:
          type: integer
        cancellation_type:
          type: string
        apartment_number:
          type: string
        floor:
          type: string
        staircase:
          type: string
        has_balcony:
          type: boolean
        amenities:
          type: string
        beds:
          type: integer
        min_guests:
          type: integer
        title_en:
          type: string
        description_en:
          type: string
        amenities_en:
          type: string

    ApartmentBooking:
      type: object
      properties:
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date


    AvailableApartment:
      allOf:
        - $ref: "#/components/schemas/Apartment"
        - type: object
          properties:
            bookings:
              type: array
              items:
                $ref: "#/components/schemas/ApartmentBooking"

    CreateApartment:
      type: object
      required:
        - title
        - description
        - price_per_night
        - guests
        - city
      properties:
        title:
          type: string
          example: "Loft Premium"

      description:
        type: string
        example: "Nowoczesny apartament w centrum miasta"

      price_per_night:
        type: number
        example: 420

      guests:
        type: integer
        example: 2

      city:
        type: string
        example: "Kraków"

      slug:
        type: string
        nullable: true

      image:
        type: string
        nullable: true

      base_price:
        type: number
        nullable: true

      max_rooms:
        type: integer
        nullable: true

      cancellation_type:
        type: string
        nullable: true

      apartment_number:
        type: string
        nullable: true

      floor:
        type: string
        nullable: true

      staircase:
        type: string
        nullable: true

      has_balcony:
        type: boolean
        nullable: true

      amenities:
        type: string
        nullable: true

      beds:
        type: integer
        nullable: true

      min_guests:
        type: integer
        nullable: true

    UpdateApartment:
      type: object
      properties:
        title:
          type: string
        description:
          type: string


    CreateApartmentImage:
      type: object
      properties:
        apartment_id:
          type: string
          format: uuid
        image_url:
          type: string


    ApartmentNotFound:
      type: object
      properties:
        message:
          type: string


    InternalServerError:
      type: object
      properties:
        message:
          type: string