paths:

  /bookings:
    post:
      tags:
        - bookings
      summary: Create new booking
      description: Public endpoint. Creates booking with default "pending" status.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apartment_id
                - check_in
                - check_out
                - guests
                - email
                - total_price
                - first_name
                - last_name
                - phone
                - city
                - zip
                - street
                - country

              properties:
                apartment_id:
                  type: string
                  format: uuid
                  example: "836a7a1e-e435-45a1-b9f0-acc10381a83b"

                check_in:
                  type: string
                  format: date
                  example: "2026-06-14"

                check_out:
                  type: string
                  format: date
                  example: "2026-06-17"

                guests:
                  type: integer
                  example: 2

                email:
                  type: string
                  format: email
                  example: "test@email.com"

                total_price:
                  type: number
                  example: 600

                first_name:
                  type: string
                  example: "Jan"

                last_name:
                  type: string
                  example: "Kowalski"

                phone:
                  type: string
                  example: "500600700"

                city:
                  type: string
                  example: "Warszawa"

                zip:
                  type: string
                  example: "00-001"

                street:
                  type: string
                  example: "Marszałkowska 10"

                country:
                  type: string
                  example: "Polska"

                notes:
                  type: string
                  example: "Late check-in"

      responses:
        201:
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

        400:
          description: Validation error

        409:
          description: Apartment not available

    get:
      tags:
        - bookings
      summary: Get all bookings (ADMIN ONLY)
      security:
        - cookieAuth: []
      description: |
        Returns all bookings.
        Filters are optional (status, apartment_id, email, date range).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed]

        - name: apartment_id
          in: query
          schema:
            type: string
            format: uuid

        - name: email
          in: query
          schema:
            type: string
            format: email

        - name: fromDate
          in: query
          schema:
            type: string
            format: date

        - name: toDate
          in: query
          schema:
            type: string
            format: date

      responses:
        200:
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        401:
          description: Unauthorized
        403:
          description: Forbidden


  /bookings/blocked:
    post:
      tags:
        - bookings
      summary: Get blocked dates for apartment
      description: Public endpoint. Returns booked date ranges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apartmentId
              properties:
                apartmentId:
                  type: string
                  format: uuid

      responses:
        200:
          description: Blocked booking dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                          format: date
                        to:
                          type: string
                          format: date


  /bookings/{id}:
    get:
      tags:
        - bookings
      summary: Get booking by ID (ADMIN ONLY)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        404:
          description: Booking not found
        401:
          description: Unauthorized
        403:
          description: Forbidden

    patch:
      tags:
        - bookings
      summary: Update booking (ADMIN ONLY)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBooking"
      responses:
        200:
          description: Booking updated
        404:
          description: Booking not found

    delete:
      tags:
        - bookings
      summary: Delete booking (ADMIN ONLY)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Booking deleted
        404:
          description: Booking not found


  /bookings/{id}/status:
    patch:
      tags:
        - bookings
      summary: Update booking status (ADMIN ONLY)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, cancelled, completed]
      responses:
        200:
          description: Status updated
        400:
          description: Invalid status
        404:
          description: Booking not found


  /bookings/apartment/{id}:
    get:
      tags:
        - bookings
      summary: Get bookings by apartment ID (ADMIN ONLY)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Bookings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"


components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:

    CreateBooking:
      type: object
      required:
        - apartment_id
        - check_in
        - check_out
        - guests
        - email
        - total_price
        - first_name
        - last_name
        - phone
        - city
        - zip
        - street
        - country
      properties:
        apartment_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
        email:
          type: string
          format: email
        total_price:
          type: number
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        city:
          type: string
        zip:
          type: string
        street:
          type: string
        country:
          type: string
        notes:
          type: string

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        apartment_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
        email:
          type: string
          format: email

        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]

        total_price:
          type: number

        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string

        city:
          type: string
        zip:
          type: string
        street:
          type: string
        country:
          type: string

        notes:
          type: string

        hold_expires_at:
          type: string
          format: date-time
          nullable: true

        created_at:
          type: string
          format: date-time

    UpdateBooking:
      type: object
      description: Partial update of booking (admin only)
      properties:
        apartment_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
        email:
          type: string
          format: email
        total_price:
          type: number
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        city:
          type: string
        zip:
          type: string
        street:
          type: string
        country:
          type: string
        notes:
          type: string