paths:

  /bookings:
    get:
      tags:
        - bookings
      summary: Get bookings (paginated)
      security:
        - bearerAuth: []

      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1

        - name: limit
          in: query
          schema:
            type: integer
            example: 10

        - name: status
          in: query
          schema:
            type: string
            example: confirmed

        - name: apartment_id
          in: query
          schema:
            type: string
            format: uuid

        - name: email
          in: query
          schema:
            type: string

        - name: fromDate
          in: query
          schema:
            type: string
            format: date

        - name: toDate
          in: query
          schema:
            type: string
            format: date

      responses:
        200:
          description: Paginated bookings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Booking"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

  /bookings/{id}:
    get:
      tags:
        - bookings
      summary: Get booking by ID
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        200:
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

        404:
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingNotFound"

    patch:
      tags:
        - bookings
      summary: Update booking
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBooking"

      responses:
        200:
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

    delete:
      tags:
        - bookings
      summary: Delete booking
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        200:
          description: Booking deleted

  /bookings/{id}/status:
    patch:
      tags:
        - bookings
      summary: Update booking status
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, cancelled, completed]

      responses:
        200:
          description: Status updated

  /bookings/apartment/{id}:
    get:
      tags:
        - bookings
      summary: Get bookings by apartment ID
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        200:
          description: Bookings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

components:

  schemas:

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid

        apartment_id:
          type: string
          format: uuid

        check_in:
          type: string
          format: date

        check_out:
          type: string
          format: date

        guests:
          type: integer

        email:
          type: string
          format: email

        status:
          type: string

        created_at:
          type: string
          format: date-time

    CreateBooking:
      type: object
      required:
        - apartment_id
        - check_in
        - check_out
        - guests
        - email

      properties:
        apartment_id:
          type: string
          format: uuid

        check_in:
          type: string
          format: date

        check_out:
          type: string
          format: date

        guests:
          type: integer

        email:
          type: string
          format: email

    UpdateBooking:
      type: object
      properties:
        apartment_id:
          type: string
          format: uuid

        check_in:
          type: string
          format: date

        check_out:
          type: string
          format: date

        guests:
          type: integer

        email:
          type: string
          format: email

        status:
          type: string

    BookingNotFound:
      type: object
      properties:
        message:
          type: string
          example: Booking not found