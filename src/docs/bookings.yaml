paths:

  /bookings/blocked:
    post:
      tags:
        - bookings
      summary: Get blocked dates for apartment

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apartmentId
              properties:
                apartmentId:
                  type: string
                  format: uuid

      responses:
        200:
          description: Blocked booking dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                          format: date-time
                        to:
                          type: string
                          format: date-time


  /bookings:
    get:
      tags:
        - bookings
      summary: Get all bookings (ADMIN ONLY)
      security:
        - bearerAuth: []

      description: |
        Returns all bookings.
        All query params are optional — if none provided, returns all bookings.

      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 10

        - name: status
          in: query
          required: false
          schema:
            type: string
            example: pending

        - name: apartment_id
          in: query
          required: false
          schema:
            type: string
            format: uuid

        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email

        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date

      responses:
        200:
          description: Admin bookings response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookingResponse"

        401:
          description: Unauthorized

        500:
          description: Internal server error


  /bookings/{id}:
    get:
      tags:
        - bookings
      summary: Get booking by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

        404:
          description: Booking not found


    patch:
      tags:
        - bookings
      summary: Update booking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBooking"
      responses:
        200:
          description: Updated booking


    delete:
      tags:
        - bookings
      summary: Delete booking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: Deleted booking


  /bookings/{id}/status:
    patch:
      tags:
        - bookings
      summary: Update booking status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, cancelled, completed]

      responses:
        200:
          description: Status updated


  /bookings/apartment/{id}:
    get:
      tags:
        - bookings
      summary: Get bookings by apartment ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: Bookings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"


components:

  schemas:

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        apartment_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
        email:
          type: string
          format: email
        status:
          type: string

        total_price:
          type: number
        price_total:
          type: number

        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string

        city:
          type: string
        zip:
          type: string
        street:
          type: string
        country:
          type: string
        notes:
          type: string

        hold_expires_at:
          type: string
          nullable: true
          format: date-time

        created_at:
          type: string
          format: date-time


    AdminBookingResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"

        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer


    UpdateBooking:
      type: object
      properties:
        apartment_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
        email:
          type: string
          format: email
        status:
          type: string


    BookingNotFound:
      type: object
      properties:
        message:
          type: string