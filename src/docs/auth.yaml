paths:

  /auth/admin/login:
    post:
      tags:
        - auth
      summary: Admin login
      description: |
        Authenticates administrator using Supabase Auth.

        On success backend creates HttpOnly session cookies:
        - access_token
        - refresh_token

        Frontend should use `credentials: include` for all authenticated requests.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"

      responses:
        200:
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookies
              schema:
                type: string

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

        401:
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /auth/logout:
    post:
      tags:
        - auth
      summary: Logout user
      description: |
        Removes authentication cookies.

      responses:
        200:
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out


  /auth/me:
    get:
      tags:
        - auth
      summary: Get current authenticated user
      description: |
        Returns currently authenticated user based on access_token cookie.

      responses:
        200:
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


components:

  schemas:

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@swtest.pl

        password:
          type: string
          format: password
          example: secret123


    AuthUser:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid

            email:
              type: string
              format: email
              example: admin@swtest.pl


    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Unauthorized


    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Validation error

        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email

              message:
                type: string
                example: Invalid email