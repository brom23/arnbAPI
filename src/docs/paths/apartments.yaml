paths:

  /apartments:
    get:
      tags:
        - apartments
      summary: Get all apartments
      description: Returns list of all apartments with basic pricing and metadata
      responses:
        200:
          description: List of all apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/apartment.yaml#/Apartment"
              example:
                - id: "194d18a1-2109-4fa2-9c37-939d85ea8b1e"
                  title: "Loft Premium"
                  slug: null
                  description: "uzy"
                  price_per_night: 420
                  guests: 2
                  city: "Kraków"
                  image: "https://example.com/image.jpg"
                  created_at: "2026-05-12T12:28:54.721482"
                  base_price: 100
                  max_rooms: 1
                  cancellation_type: "flexible"
                  apartment_number: "1"
                  floor: "parter"
                  staircase: "1"
                  has_balcony: false
                  amenities: "wifi, kitchen"
                  beds: 2
                  min_guests: 1
                  title_en: "Premium Loft"
                  description_en: "Big"
                  amenities_en: "kitchen, wifi"
        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    post:
      tags:
        - apartments
      summary: Create apartment
      description: |
        Creates a new apartment.
        Validated with Zod schema (createApartmentSchema).
      cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components/schemas/apartment.yaml#/CreateApartment"
            example:
              title: "Loft Premium"
              description: "Nowoczesny apartament w centrum miasta"
              price_per_night: 420
              guests: 2
              city: "Kraków"
              base_price: 100
              max_rooms: 1
              cancellation_type: "flexible"
              apartment_number: "1A"
              floor: "2"
              staircase: "A"
              has_balcony: false
              amenities: "wifi, kitchen, tv"
              beds: 2
              min_guests: 1

      responses:
        201:
          description: Apartment created successfully
          content:
            application/json:
              schema:
                $ref: "../components/schemas/apartment.yaml#/Apartment"

        400:
          $ref: "../components/responses/common.yaml#/ValidationError"

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartments/search:
    get:
      tags:
        - apartments
      summary: Search apartments
      description: |
        Search apartments with optional filters.

        Business rules:
        - from and to must be provided together
        - from cannot be in the past
        - minimum stay is 1 night

      parameters:
        - $ref: "../components/parameters/common.yaml#/from"
        - $ref: "../components/parameters/common.yaml#/to"
        - $ref: "../components/parameters/common.yaml#/guests"
        - $ref: "../components/parameters/common.yaml#/city"

      responses:

        200:
          description: List of available apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/apartment.yaml#/Apartment"

        400:
          $ref: "../components/responses/common.yaml#/ValidationError"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartments/available:
    post:
      tags:
        - apartments
      summary: Get available apartments
      description: Airbnb-like overlap logic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from
                - to
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                guests:
                  type: integer
                  nullable: true

      responses:
        200:
          description: Available apartments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/apartment.yaml#/AvailableApartment"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartments/{id}:
    get:
      tags:
        - apartments
      summary: Get apartment by ID
      parameters:
        - $ref: "../components/parameters/common.yaml#/id"

      responses:
        200:
          description: Apartment
          content:
            application/json:
              schema:
                $ref: "../components/schemas/apartment.yaml#/Apartment"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    patch:
      tags:
        - apartments
      summary: Update apartment
      cookieAuth: []
      parameters:
        - $ref: "../components/parameters/common.yaml#/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components/schemas/apartment.yaml#/Apartment"
      responses:
        200:
          description: Apartment
          content:
            application/json:
              schema:
                $ref: "../components/schemas/apartment.yaml#/Apartment"

        400:
          $ref: "../components/responses/common.yaml#/ValidationError"

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"
          
        404:
            $ref: "../components/responses/common.yaml#/NotFound"
        
        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    delete:
      tags:
        - apartments
      summary: Delete apartment
      cookieAuth: []
      parameters:
        - $ref: "../components/parameters/common.yaml#/id"
      responses:
        200:
          description: Apartment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Apartment deleted successfully

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"
          
        404:
            $ref: "../components/responses/common.yaml#/NotFound"
        
        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"


  /apartments/{id}/cover:
    patch:
      tags:
        - apartments
      summary: Update cover image
      cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageId
              properties:
                imageId:
                  type: string
                  format: uuid
      responses:
        200:
          description: Updated

        400:
          $ref: "../components/responses/common.yaml#/BadRequest"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartments/{id}/images:
    get:
      tags:
        - apartments
      summary: Get apartment images
      parameters:
        - $ref: "../components/parameters/common.yaml#/id"

      responses:
        200:
          description: List of apartment images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/apartment-image.yaml#/ApartmentImage"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartments/{id}/pricing:
    get:
      tags:
        - apartments
      summary: Get apartment pricing calendar
      description: |
        Returns pricing map for apartment.

        Rules:
        - No query params → returns full pricing
        - from + to required together
        - invalid range → 400 error
        - no data → 404 error

      parameters:
        - $ref: "../components/parameters/common.yaml#/id"
        - $ref: "../components/parameters/common.yaml#/from"
        - $ref: "../components/parameters/common.yaml#/to"

      responses:
        200:
          description: Pricing map
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: object
                    additionalProperties:
                      type: number
              example:
                prices:
                  "2026-05-28": 101
                  "2026-05-29": 101

        400:
          $ref: "../components/responses/common.yaml#/BadRequest"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    patch:
      tags:
        - apartments
      summary: Bulk update apartment pricing
      description: |
        Creates or updates apartment pricing records.

        Existing dates are updated.
        Missing dates are inserted.

      parameters:
        - "../components/parameters/common.yaml#/id"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "../components/schemas/apartment.yaml#/ApartmentPriceUpdate"
            example:
              - date: "2026-12-24"
                price: 1200
              - date: "2026-12-25"
                price: 1500
              - date: "2026-12-26"
                price: 1400

      responses:
        200:
          description: Pricing updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/apartment.yaml#/ApartmentPricing"

        400:
          $ref: "../components/responses/common.yaml#/BadRequest"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    delete:
      tags:
        - apartments
      summary: Delete apartment pricing (single or range)
      description: |
        Deletes pricing overrides for a given apartment.

        Rules:
        - from is required
        - if only from → deletes single date
        - if from + to → deletes range inclusive

      parameters:
        - $ref: "../components/parameters/common.yaml#/id"
        - $ref: "../components/parameters/common.yaml#/from"
        - $ref: "../components/parameters/common.yaml#/to"

    responses:
      200:
        description: Pricing deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Pricing deleted successfully"

      400:
        $ref: "../components/responses/common.yaml#/BadRequest"

      500:
        $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartments/{id}/status:
    patch:
      tags:
        - apartments
      summary: Update apartment status
      description: Updates apartment status.

      parameters:
        - $ref: "../components/parameters/common.yaml#/id"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  example: active

            example:
              status: active

      responses:
        200:
          description: Apartment status updated successfully
          content:
            application/json:
              schema:
                $ref: "../components/schemas/apartment.yaml#/Apartment"

        400:
          $ref: "../components/responses/common.yaml#/BadRequest"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartments/{id}/bookings/unavailable-dates:
    get:
      tags:
        - apartments
      summary: Get unavailable dates
      parameters:
        - $ref: "../components/parameters/common.yaml#/id"
      responses:
        200:
          description: OK

  /apartment-images:
    get:
      tags:
        - apartment-images
      summary: Get images
      responses:
        200:
          description: OK

    post:
      tags:
        - apartment-images
      summary: Create image
      cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components/schemas/apartment.yaml#/CreateApartmentImage"
      responses:
        201:
          description: Created

