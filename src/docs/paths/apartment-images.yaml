paths:

  /apartment-images:

    get:
      tags:
        - apartment-images
      summary: Get all apartment images

      responses:
        200:
          description: List of apartment images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/apartment-image.yaml#/ApartmentImage"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    post:
      tags:
        - apartment-images
      summary: Create apartment image (metadata only)
      description: Admin only
      security:
        - cookieAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components/schemas/apartment-image.yaml#/CreateApartmentImage"

      responses:
        201:
          description: Apartment image created
          content:
            application/json:
              schema:
                $ref: "../components/schemas/apartment-image.yaml#/ApartmentImage"

        400:
          $ref: "../components/responses/common.yaml#/ValidationError"

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartment-images/upload:

    post:
      tags:
        - apartment-images
      summary: Upload image file
      description: Admin only - uploads file to storage
      security:
        - cookieAuth: []

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - apartmentId
                - image
              properties:

                apartmentId:
                  type: string
                  format: uuid

                image:
                  type: string
                  format: binary

      responses:
        201:
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: "../components/schemas/apartment-image.yaml#/ApartmentImage"

        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "../components/schemas/common.yaml#/ErrorResponse"
              examples:

                missingFile:
                  value:
                    message: Image file is required

                missingApartmentId:
                  value:
                    message: Apartment ID is required

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /apartment-images/{id}:

    patch:
      tags:
        - apartment-images
      summary: Update apartment image
      security:
        - cookieAuth: []

      parameters:
        $ref: "../components/parameters/common.yaml#/id"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components/schemas/apartment-image.yaml#/UpdateApartmentImage"

      responses:
        200:
          description: Apartment image updated
          content:
            application/json:
              schema:
                $ref: "../components/schemas/apartment-image.yaml#/ApartmentImage"

        400:
          $ref: "../components/responses/common.yaml#/BadRequest"

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    delete:
      tags:
        - apartment-images
      summary: Delete apartment image
      description: Deletes database record and storage file
      security:
        - cookieAuth: []

      parameters:
        - $ref: "../components/parameters/common.yaml#/id"

      responses:
        200:
          description: Image deleted successfully
          content:
            application/json:
              schema:
                $ref: "#schemas/SuccessResponse"
              example:
                message: "Image deleted successfully"
        400:
          $ref: "../components/responses/common.yaml#/BadRequest"

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"

        404:
          $ref: "../components/responses/common.yaml#/NotFound"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"
