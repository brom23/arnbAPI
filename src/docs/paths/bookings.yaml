paths:

  /bookings:
    post:
      tags:
        - bookings
      summary: Create new booking
      description: Public endpoint. Creates booking with default "pending" status.
      requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: "../components/schemas/booking.yaml#/CreateBooking"

      responses:
        201:
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: "../components/schemas/booking.yaml#/Booking"

        400:
          $ref: "../components/responses/common.yaml#/ValidationError"

        409:
          description: Apartment not available          
          content:
            application/json:
              schema:
                $ref: "../components/schemas/common.yaml#/ErrorResponse"
              example:
                message: Apartment is not available for selected dates     
        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    get:
      tags:
        - bookings
      summary: Get all bookings (ADMIN ONLY)
      security:
        - cookieAuth: []
      description: |
        Returns all bookings.
        Filters are optional (status, apartment_id, email, date range).
      parameters:
        - $ref: "../components/parameters/common.yaml#/status"
        - $ref: "../components/parameters/common.yaml#/apartment_id"
        - $ref: "../components/parameters/common.yaml#/email"
        - $ref: "../components/parameters/common.yaml#/fromDate"
        - $ref: "../components/parameters/common.yaml#/toDate"

      responses:
        200:
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/booking.yaml#/Booking"
        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"
        403:
          $ref: "../components/responses/common.yaml#/Forbidden"
        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /bookings/blocked:
    post:
      tags:
        - bookings
      summary: Get blocked dates for apartment
      description: Public endpoint. Returns booked date ranges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apartmentId
              properties:
                apartmentId:
                  type: string
                  format: uuid

      responses:
        200:
          description: Blocked booking dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                          format: date
                        to:
                          type: string
                          format: date
  /bookings/calendar:
    get:
      tags:
        - bookings
      summary: Get bookings calendar (ADMIN ONLY)
      description: |
        Returns bookings overlapping the provided date range.

        Validation rules:
        - from and to are required
        - dates must be in YYYY-MM-DD format
        - to must be greater than or equal to from

      parameters:
        - $ref: "../components/parameters/common.yaml#/from"
        - $ref: "../components/parameters/common.yaml#/to"

      responses:
        200:
          description: Calendar bookings
          content:
            application/json:
              schema:
                type: array
                example:
                - id: "26acc6bd-6121-494b-ba46-289cc9ee3b5c"
                  apartment_id: "a1fb4c0e-0262-4771-a02d-8b45dce51888"
                  check_in: "2026-07-10"
                  check_out: "2026-07-14"
                  email: "john@example.com"
                  status: "confirmed"
                  guests: 2
                  total_price: 1200
                  first_name: "John"
                  last_name: "Smith"
                  apartments:
                    title: "Apartament Nad Morzem"
                items:
                  $ref: "../components/schemas/booking.yaml#/CalendarBooking"
              
        400:
          $ref: "../components/responses/common.yaml#/ValidationError"

        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /bookings/{id}:
    get:
      tags:
        - bookings
      summary: Get booking by ID (ADMIN ONLY)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "../components/schemas/booking.yaml#/Booking"
        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"
          
        404:
            $ref: "../components/responses/common.yaml#/NotFound"
          
        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

    delete:
      tags:
        - bookings
      summary: Delete booking (ADMIN ONLY)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "../components/parameters/common.yaml#/id"

      responses:
        200:
          description: Booking deleted
        404:
          $ref: "../components/responses/common.yaml#/NotFound"

  /bookings/{id}/cancel:
    post:
      tags:
        - bookings
      summary: Cancel booking (admin)
      description: Cancels a booking. Only admin can perform this action.
      cookieAuth: []
      parameters:
        $ref: "../components/parameters/common.yaml#/id"

      responses:
        200:
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                $ref: "../components/schemas/booking.yaml#/Booking"

        400:
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "../components/responses/common.yaml#/ValidationError"

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"
          
        404:
            $ref: "../components/responses/common.yaml#/NotFound"
          
        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /bookings/{id}/confirm:
    post:
      tags:
        - bookings
      summary: Confirm booking (admin)
      description: Confirms a booking. Only admin can perform this action.
      cookieAuth: []
      parameters:
        $ref: "../components/parameters/common.yaml#/id"

      responses:
        200:
          description: Booking confirmed successfully
          content:
            application/json:
              schema:
                $ref: "../components/schemas/booking.yaml#/Booking"

        400:
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "../components/schemas/common.yaml#/ErrorResponse"

        401:
          $ref: "../components/responses/common.yaml#/Unauthorized"

        403:
          $ref: "../components/responses/common.yaml#/Forbidden"
          
        404:
            $ref: "../components/responses/common.yaml#/NotFound"
          
        500:
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /bookings/apartment/{id}:
    get:
      tags:
        - bookings
      summary: Get bookings by apartment ID (ADMIN ONLY)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Bookings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/schemas/booking.yaml#/Booking"
