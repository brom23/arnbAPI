paths:

  /auth/admin/login:
    post:
      cookieAuth: []
      tags:
        - auth
      summary: Admin login
      description: |
        Authenticates administrator using Supabase Auth.

        On success backend creates HttpOnly session cookies:
        - access_token
        - refresh_token

        Frontend should use `credentials: include` for all authenticated requests.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/LoginRequest"

      responses:
        200:
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookies
              schema:
                type: string

          content:
            application/json:
              schema:
                $ref: "../components/schemas/auth.yaml#/AuthUser"

        400:
          description: Email and password are required
          content:
            application/json:
              schema:
                $ref: "../components/schemas/common.yaml#/ErrorResponse"
              example:
                message: Email and password are required


        401:
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "../components/schemas/common.yaml#/ErrorResponse"
              example:
                message: Invalid email or password

        500: 
          $ref: "../components/responses/common.yaml#/InternalServerError"

  /auth/refresh:
    post:
      cookieAuth: []
      tags:
        - auth
      summary: Refresh authentication session
      description: |
        Uses refresh_token HttpOnly cookie to obtain a new Supabase session.

        On success backend updates:
        - access_token cookie
        - refresh_token cookie

        Frontend should call this endpoint after receiving 401 Unauthorized
        and then retry the original request.

      responses:
        200:
          description: Session refreshed
          headers:
            Set-Cookie:
              description: Updated HttpOnly authentication cookies
              schema:
                type: string

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

        401:
          description: Missing, expired or invalid refresh token
          content:
            application/json:
              schema:
                $ref: "../components/schemas/common.yaml#/ErrorResponse"
              example:
                message: "Refresh token missing"

  /auth/logout:
    post:
      cookieAuth: []
      tags:
        - auth
      summary: Logout user
      description: |
        Removes authentication cookies.

      responses:
        200:
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out

  /auth/me:
    get:
      tags:
        - auth
      summary: Get current authenticated user
      description: |
        Returns currently authenticated user based on access_token cookie.
      cookieAuth: []
      responses:
        200:
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "../components/schemas/auth.yaml#/AuthUser"

        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../components/schemas/common.yaml#/ErrorResponse"
